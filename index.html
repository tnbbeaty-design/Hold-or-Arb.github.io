<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bet Evaluator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #000; color: #fff; }
    .card { background: #1c1c1e; padding: 20px; border-radius: 14px; margin-bottom: 15px; }
    label { font-size: 14px; color: #8e8e93; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; background: #2c2c2e; border: none; border-radius: 8px; color: #fff; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
    button { width: 100%; padding: 15px; background: #0a84ff; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 16px; }
    #result { margin-top: 20px; padding: 15px; border-radius: 10px; font-weight: bold; text-align: center; display: none; }
    .close { background: #30d158; color: #000; }
    .hold { background: #ff453a; color: #fff; }
  </style>
</head>
<body>
  <h2>Live Bet Evaluator</h2>
  <div class="card">
    <label>Stake ($)</label>
    <input type="number" id="stake" value="7">

    <label>Original Decimal Odds</label>
    <input type="number" id="origOdds" step="0.01" placeholder="e.g. 2.30">

    <label>Current Fair Decimal Odds</label>
    <input type="number" id="fairOdds" step="0.01" placeholder="e.g. 1.83">

    <label>Offered Profit ($)</label>
    <input type="number" id="offeredProfit" step="0.01" placeholder="e.g. 0.50">

    <button onclick="evaluateBet()">Evaluate Bet</button>
  </div>

  <div id="result"></div>

  <script>
    function evaluateBet() {
      const stake = parseFloat(document.getElementById('stake').value);
      const orig = parseFloat(document.getElementById('origOdds').value);
      const fair = parseFloat(document.getElementById('fairOdds').value);
      const profit = parseFloat(document.getElementById('offeredProfit').value);

      const holdEV = stake * ((orig / fair) - 1);
      const resDiv = document.getElementById('result');
      resDiv.style.display = 'block';

      if (profit > holdEV) {
        resDiv.className = 'close';
        resDiv.innerHTML = `✅ CLOSE EARLY<br>Offered ($${profit.toFixed(2)}) > Hold EV ($${holdEV.toFixed(2)})`;
      } else {
        resDiv.className = 'hold';
        resDiv.innerHTML = `🛑 HOLD BET<br>Hold EV ($${holdEV.toFixed(2)}) > Offered ($${profit.toFixed(2)})`;
      }
    }
  </script>
</body>
</html>
