<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bet Evaluator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #000; color: #fff; }
    .card { background: #1c1c1e; padding: 20px; border-radius: 14px; margin-bottom: 15px; }
    label { font-size: 13px; color: #8e8e93; display: block; margin-bottom: 4px; margin-top: 10px; }
    input, select { width: 100%; padding: 12px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; color: #fff; font-size: 16px; box-sizing: border-box; }
    select { margin-bottom: 6px; }
    button { width: 100%; padding: 15px; background: #0a84ff; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 16px; margin-top: 15px; }
    #result { margin-top: 15px; padding: 15px; border-radius: 10px; font-weight: bold; text-align: center; display: none; line-height: 1.4; }
    .close { background: #30d158; color: #000; }
    .hold { background: #ff453a; color: #fff; }
  </style>
</head>
<body>
  <h2>Live Bet Evaluator</h2>
  <div class="card">
    <label>Stake ($)</label>
    <input type="number" id="stake" value="7" step="any">

    <label>Original Odds Format</label>
    <select id="origType">
      <option value="american">American (+130, -150)</option>
      <option value="decimal">Decimal (2.30, 1.67)</option>
      <option value="prob">Implied Probability % (43.5%)</option>
    </select>
    <input type="number" id="origOdds" step="any" placeholder="e.g. +130 or 2.30 or 43.5">

    <label>Current Fair Odds Format</label>
    <select id="fairType">
      <option value="american">American (+130, -150)</option>
      <option value="decimal" selected>Decimal (2.30, 1.67)</option>
      <option value="prob">Implied Probability % (43.5%)</option>
    </select>
    <input type="number" id="fairOdds" step="any" placeholder="e.g. -120 or 1.83 or 54.5">

    <label>Offered Early Profit ($)</label>
    <input type="number" id="offeredProfit" step="any" placeholder="e.g. 0.50">

    <button onclick="evaluateBet()">Evaluate Bet</button>
  </div>

  <div id="result"></div>

  <script>
    function toDecimal(val, type) {
      val = parseFloat(val);
      if (isNaN(val)) return null;
      
      if (type === 'decimal') {
        return val;
      } else if (type === 'american') {
        if (val > 0) return (val / 100) + 1;
        if (val < 0) return (100 / Math.abs(val)) + 1;
        return null;
      } else if (type === 'prob') {
        if (val <= 0 || val >= 100) return null;
        return 100 / val;
      }
      return null;
    }

    function evaluateBet() {
      const stake = parseFloat(document.getElementById('stake').value);
      const origVal = document.getElementById('origOdds').value;
      const origType = document.getElementById('origType').value;
      const fairVal = document.getElementById('fairOdds').value;
      const fairType = document.getElementById('fairType').value;
      const profit = parseFloat(document.getElementById('offeredProfit').value);

      const origDecimal = toDecimal(origVal, origType);
      const fairDecimal = toDecimal(fairVal, fairType);

      const resDiv = document.getElementById('result');

      if (!stake || !origDecimal || !fairDecimal || isNaN(profit)) {
        resDiv.style.display = 'block';
        resDiv.className = 'hold';
        resDiv.innerHTML = '⚠️ Please enter valid inputs for all fields.';
        return;
      }

      const holdEV = stake * ((origDecimal / fairDecimal) - 1);
      resDiv.style.display = 'block';

      if (profit > holdEV) {
        resDiv.className = 'close';
        resDiv.innerHTML = `✅ CLOSE EARLY<br>Offered Profit: $${profit.toFixed(2)}<br>Hold EV: $${holdEV.toFixed(2)}`;
      } else {
        resDiv.className = 'hold';
        resDiv.innerHTML = `🛑 HOLD BET<br>Hold EV: $${holdEV.toFixed(2)}<br>Offered Profit: $${profit.toFixed(2)}`;
      }
    }
  </script>
</body>
</html>
